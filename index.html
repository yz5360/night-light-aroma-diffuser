<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Night Light & Aroma Diffuser · Interactive Model</title>
  <style>
    :root { --ink:#23313a; --muted:#71808a; --line:#dce6e8; --green:#61bb8d; --warm:#ffd98a; --mist:#c9edf2; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Inter,system-ui,-apple-system,"PingFang SC",sans-serif; color:var(--ink); background:linear-gradient(145deg,#edf7f5,#fff8ee); }
    .app { width:min(920px,100%); display:grid; grid-template-columns:1.1fr .9fr; gap:22px; }
    .card { background:rgba(255,255,255,.82); border:1px solid rgba(255,255,255,.9); border-radius:28px; box-shadow:0 22px 55px rgba(45,74,78,.13); padding:28px; }
    header { grid-column:1/-1; } h1 { margin:0 0 7px; font-size:clamp(26px,4vw,39px); letter-spacing:-.04em; } p { color:var(--muted); margin:0; line-height:1.6; }
    .machine-wrap { display:grid; place-items:center; min-height:450px; overflow:hidden; }
    .machine { position:relative; width:250px; height:330px; border-radius:82px 82px 42px 42px; background:linear-gradient(100deg,#eef2f0,#fff 42%,#e7eeeb); box-shadow:inset -14px -14px 25px #d5dfdc, inset 10px 4px 20px white, 0 18px 30px #b5c8c5; }
    .machine::before { content:""; position:absolute; top:24px; left:27px; right:27px; height:34px; border-radius:50%; background:#f8fbfa; box-shadow:inset 0 -5px 7px #d4dfdd; }
    .machine.on { box-shadow:inset -14px -14px 25px #d5dfdc, inset 10px 4px 20px white, 0 18px 30px #b5c8c5, 0 0 42px rgba(104,219,190,.28); }
    .mist { position:absolute; width:100%; height:120px; top:-65px; opacity:0; pointer-events:none; background:radial-gradient(ellipse at 50% 100%,rgba(202,243,245,.7),transparent 64%); filter:blur(2px); }
    .mist.active { opacity:1; animation:float 2.8s infinite ease-in-out; }
    @keyframes float { 50% { transform:translateY(-15px) scale(1.08); opacity:.55; } }
    .glow { position:absolute; inset:95px 53px 93px; border-radius:45%; background:var(--warm); opacity:0; filter:blur(20px); transition:.35s; }
    .glow.low { opacity:.22; } .glow.high { opacity:.58; }
    .panel { position:absolute; bottom:23px; left:33px; right:33px; display:flex; justify-content:space-between; align-items:center; }
    .buttons { display:flex; gap:10px; } button { border:0; cursor:pointer; font:inherit; color:var(--ink); transition:.18s; } button:active { transform:scale(.96); }
    .round { width:50px; height:50px; border-radius:50%; background:#f9fbfa; box-shadow:0 3px 10px #c6d3d0; font-size:21px; } .round:hover { background:#eaf8f4; }
    .status { display:flex; gap:12px; align-items:center; margin:22px 0; padding:16px; border-radius:17px; background:#f5faf8; }
    .dot { width:12px; height:12px; border-radius:50%; background:#c8d3d1; } .dot.live { background:var(--green); box-shadow:0 0 0 6px #dff5e9; }
    .readout { font-size:30px; font-weight:750; letter-spacing:-.04em; } .sub { color:var(--muted); font-size:13px; }
    .timer { margin:10px 0 20px; height:9px; background:#edf2f1; border-radius:99px; overflow:hidden; } .timer > div { height:100%; width:0; background:linear-gradient(90deg,var(--green),#95ddaf); transition:width .4s; }
    .controls { display:grid; gap:12px; } .control { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 16px; border:1px solid var(--line); border-radius:16px; background:white; } .control button { padding:10px 15px; border-radius:12px; background:#e9f7f0; font-weight:700; }
    .scale { position:absolute; bottom:88px; left:30px; display:grid; gap:5px; } .mark { display:flex; align-items:center; gap:7px; color:#8c999c; font-size:11px; font-weight:600; } .mark::before { content:""; width:6px; height:6px; border-radius:50%; background:#d0d9d6; } .mark.active { color:#247953; } .mark.active::before { background:#42c97e; box-shadow:0 0 8px #42c97e; }
    .legend { font-size:13px; color:var(--muted); margin-top:20px; } .legend strong { color:var(--ink); }
    @media (max-width:700px) { .app { grid-template-columns:1fr; } header { grid-column:auto; } .machine-wrap { min-height:390px; } }
  </style>
</head>
<body>
  <main class="app">
    <header><h1>Night Light & Aroma Diffuser</h1><p>An interactive model of the appliance's states and controls</p></header>
    <section class="card machine-wrap" aria-label="Appliance state visualization">
      <div id="machine" class="machine"><div id="mist" class="mist"></div><div id="glow" class="glow"></div><div class="scale" aria-label="Mist timer settings"><div class="mark" data-min="180">180 min</div><div class="mark" data-min="120">120 min</div><div class="mark" data-min="60">60 min</div><div class="mark" data-min="30">30 min</div></div><div class="panel"><span class="sub">POWERED</span><div class="buttons"><button class="round" id="mistBtn" aria-label="Change mist timer">〰</button><button class="round" id="lightBtn" aria-label="Change light brightness">☼</button></div></div></div>
    </section>
    <section class="card">
      <div class="status"><span id="dot" class="dot"></span><div><div id="readout" class="readout">Mist off</div><div id="detail" class="sub">Press Mist to start a timer</div></div></div>
      <div class="timer"><div id="progress"></div></div>
      <div class="controls">
        <div class="control"><span>Mist</span><button id="mistControl">Start / Change</button></div>
        <div class="control"><span>Light: <strong id="lightLabel">Off</strong></span><button id="lightControl">Change brightness</button></div>
      </div>
      <p class="legend"><strong>Controls:</strong> Mist cycles through 180 → 120 → 60 → 30 minutes → Off. Light cycles through Off → High → Low → Off.</p>
    </section>
  </main>
  <script>
    // Appliance state variables
    let isPowered = true;
    let waterSufficient = true;
    let mistMode = 0; // 0 means off; otherwise minutes
    let remainingSeconds = 0;
    let lightMode = 0; // 0 off, 1 high, 2 low
    const mistModes = [0, 180, 120, 60, 30];
    const $ = (id) => document.getElementById(id);

    function beep() {
      // A short visual/audio acknowledgement for a button press.
      document.body.animate([{filter:'brightness(1)'},{filter:'brightness(1.08)'},{filter:'brightness(1)'}], {duration:180});
    }

    function setMist() {
      if (!isPowered || !waterSufficient) return;
      const next = (mistModes.indexOf(mistMode) + 1) % mistModes.length;
      mistMode = mistModes[next];
      remainingSeconds = mistMode * 60;
      beep();
      render();
    }

    function setLight() {
      lightMode = (lightMode + 1) % 3;
      beep();
      render();
    }

    function render() {
      const running = mistMode > 0 && remainingSeconds > 0;
      $('machine').classList.toggle('on', running);
      $('mist').classList.toggle('active', running);
      $('dot').classList.toggle('live', running);
      $('readout').textContent = running ? `Mist on · ${mistMode} min` : 'Mist off';
      $('detail').textContent = running ? `${formatTime(remainingSeconds)} remaining · stops automatically` : 'Press Mist to start a timer';
      $('progress').style.width = running ? `${(remainingSeconds / (mistMode * 60)) * 100}%` : '0%';
      document.querySelectorAll('.mark').forEach(mark => mark.classList.toggle('active', running && Number(mark.dataset.min) === mistMode));
      $('glow').className = `glow ${lightMode === 1 ? 'high' : lightMode === 2 ? 'low' : ''}`;
      $('lightLabel').textContent = lightMode === 0 ? 'Off' : lightMode === 1 ? 'High' : 'Low';
    }

    function formatTime(total) {
      const hours = Math.floor(total / 3600), minutes = Math.floor((total % 3600) / 60);
      return hours ? `${hours} hr ${minutes} min` : `${minutes} min`;
    }

    $('mistBtn').addEventListener('click', setMist);
    $('mistControl').addEventListener('click', setMist);
    $('lightBtn').addEventListener('click', setLight);
    $('lightControl').addEventListener('click', setLight);
    setInterval(() => {
      if (mistMode > 0 && remainingSeconds > 0) {
        remainingSeconds--;
        if (remainingSeconds === 0) { mistMode = 0; beep(); }
        render();
      }
    }, 1000);
    render();
  </script>
</body>
</html>
